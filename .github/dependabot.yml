version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react:
        patterns:
          [
            'react',
            'react-dom',
            '@types/react*',
            'react-router',
            '@tanstack/*',
            'react-hook-form',
            '@hookform/*',
          ]
      fastify:
        patterns: ['fastify', '@fastify/*']
      tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
